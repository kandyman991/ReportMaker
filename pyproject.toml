[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reportmaker"
version = "0.0.1"
description = "Windows-first modular technical report editor (M0 foundation)"
readme = "README.md"
requires-python = ">=3.11,<3.16"
authors = [{name = "ReportMaker contributors"}]
dependencies = ["python-docx>=1.2,<2", "reportlab>=4.2,<5", "Pillow>=10.4,<13", "pypdf>=5,<7"]

[project.optional-dependencies]
desktop = ["PySide6==6.12.0"]

[tool.setuptools.packages.find]
where = ["src"]
