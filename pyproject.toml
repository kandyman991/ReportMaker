[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reportmaker"
version = "0.0.1"
description = "Windows-first modular technical report editor (M0 foundation)"
readme = "README.md"
requires-python = ">=3.11,<3.16"
authors = [{name = "ReportMaker contributors"}]
dependencies = []

[project.optional-dependencies]
desktop = ["PySide6==6.12.0"]

[tool.setuptools.packages.find]
where = ["src"]
