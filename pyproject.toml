[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reportmaker"
version = "0.0.1"
description = "Windows-first modular technical report editor (M0 foundation)"
readme = "README.md"
requires-python = ">=3.11,<3.16"
authors = [{name = "ReportMaker contributors"}]
dependencies = ["python-docx>=1.2,<2", "reportlab>=4.2,<5", "Pillow>=13.0.0,<14", "pypdf>=5,<7"]

[project.optional-dependencies]
desktop = ["PySide6==6.12.0", "pillow-heif>=1.8.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"reportmaker.v2" = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]
