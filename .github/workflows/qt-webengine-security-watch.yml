name: Qt WebEngine security-update watch

# Advisory detection only. Never modifies deps, releases, artifacts, or branches.
on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pyside6-version-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed checkout v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # reviewed setup-python v5
        with:
          python-version: '3.12'
      - name: Install only version-comparison package
        run: python -m pip install --disable-pip-version-check packaging==26.3
      - name: Check independent PySide6 and PySide6-WebEngine PyPI releases against Windows lock
        run: python scripts/check_qt_webengine_updates.py
      - name: Report Chromium critical-CVE review holds (advisory only; never publish)
        run: python scripts/check_webengine_release_risk.py
