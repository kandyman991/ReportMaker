name: V2 M6.6 precise page and Word fidelity

on:
  push:
    branches: [feature/v2-m6-6-page-word-fidelity]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-m66-fidelity:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'feature/v2-m6-6-page-word-fidelity'
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install desktop application and export dependencies
        run: python -m pip install -e ".[desktop]"
      - name: Compile report layout and acceptance regression
        run: python -m compileall -q src/reportmaker/export.py src/reportmaker/v2/editor_tab.py tests/test_v2_m66_fidelity.py
      - name: Validate editable DOCX geometry, paginated PDF and Qt cards
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_m66_fidelity.py -v
          if ($LASTEXITCODE -ne 0) { throw "M6.6 Word/page fidelity regressions failed" }
      - name: Preserve M4/M6 export, media and metadata behavior
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_m4_export.py -v
          if ($LASTEXITCODE -ne 0) { throw "M4 exporter regression" }
          python -m unittest discover -s tests -p test_v2_m6_bundle.py -v
          if ($LASTEXITCODE -ne 0) { throw "M6 language bundle regression" }
          python -m unittest discover -s tests -p test_v2_m65_integration.py -v
          if ($LASTEXITCODE -ne 0) { throw "M6.5 translation/export regression" }
          python -m unittest discover -s tests -p test_rich_pdf_fidelity.py -v
          if ($LASTEXITCODE -ne 0) { throw "M6.6 PDF list/paragraph regression" }
          python -m unittest discover -s tests -p test_rich_editor.py -v
          if ($LASTEXITCODE -ne 0) { throw "M6.6 rich typography and DOCX regression" }
          python -m unittest discover -s tests -p test_template_import.py -v
          if ($LASTEXITCODE -ne 0) { throw "M6.6 safe Word template import regression" }
