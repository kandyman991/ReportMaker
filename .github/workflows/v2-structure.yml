name: V2 M2 structural placement

on:
  pull_request:
    branches: [main]
    paths:
      - "src/reportmaker/v2/**"
      - "src/reportmaker/model.py"
      - "src/reportmaker/engine.py"
      - "src/reportmaker/project_io.py"
      - "tests/test_v2_structure.py"
      - "tests/test_v2_dragdrop.py"
      - "tests/test_v2_actions.py"
      - "tests/test_v2_outline.py"
      - "tests/test_v2_session.py"
      - "tests/test_v2_inline.py"
      - "tests/test_v2_lifecycle.py"
      - ".github/workflows/v2-structure.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-v2-structure:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install native desktop dependencies
        run: python -m pip install -e ".[desktop]"
      - name: Compile V2 and regressions
        run: python -m compileall -q src/reportmaker/v2 tests/test_v2_structure.py tests/test_v2_dragdrop.py tests/test_v2_actions.py tests/test_v2_outline.py
      - name: Verify positional moves and Windows Qt toolbar
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_structure.py -v
          if ($LASTEXITCODE -ne 0) { throw "M2 structure placement gates failed" }
      - name: Verify native Qt internal drag/drop preview and commit
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_dragdrop.py -v
          if ($LASTEXITCODE -ne 0) { throw "M2 native Qt drag/drop gates failed" }
      - name: Verify M2.3 structural actions and confirmations
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_actions.py -v
          if ($LASTEXITCODE -ne 0) { throw "M2.3 structural actions gates failed" }
      - name: Verify M2.4 derived outline and local expansion state
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_outline.py -v
          if ($LASTEXITCODE -ne 0) { throw "M2.4 branch visibility/outline gates failed" }
      - name: Rerun M1.2 M1.3 M1.4 compatibility
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          foreach ($suite in @("test_v2_session.py", "test_v2_inline.py", "test_v2_lifecycle.py")) {
            python -m unittest discover -s tests -p $suite -v
            if ($LASTEXITCODE -ne 0) { throw "V2 regression failed: $suite" }
          }
      - name: Verify independent V2 launch
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m reportmaker.v2 --offline-self-test
          if ($LASTEXITCODE -ne 0) { throw "V2 import firewall failed" }
