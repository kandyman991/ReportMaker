name: V2 M7.1 isolated Windows installer preflight

# The legacy V1 installer/release workflows are intentionally untouched.
# PR builds never upload installers. An explicitly opted-in M7.3 manual QA
# workflow_dispatch can attach a short-lived, unsigned test-only installer.
# This is not a V2 release or default promotion, and does not touch V1.
on:
  pull_request:
    branches: [main, feature/v2-m7-3-native-acceptance]
    paths:
      # V2 also imports shared V1/core modules. Keep frozen/installed preflight
      # attached to ALL package/runtime changes, not only the V2 subpackage.
      - "packaging/windows/**"
      - "scripts/verify_v2_frozen_archive.py"
      - "scripts/windows_supply_chain.py"
      - "src/reportmaker/**"
      - "tests/test_v2_*.py"
      - "tests/test_windows_supply_chain.py"
      - "docs/v2/M7_ACCEPTANCE_MATRIX.json"
      - "scripts/build_v2_m73_local.ps1"
      - "scripts/m73_native_acceptance.py"
      - ".github/workflows/v2-m7-packaging.yml"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      manual_qa_installer:
        description: "Explicitly attach a 1-day unsigned V2 test installer for manual M7.3 QA"
        required: true
        type: boolean
        default: false
      attest_nonrelease_metadata:
        description: "Trusted-main-only OIDC attestation of JSON provenance/SBOM metadata; never publishes or signs installers"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  locked-windows-dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Audit pinned Windows runtime and build package versions
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python scripts/windows_supply_chain.py --lock packaging/windows/requirements-win314-x64.lock --verify-only
          python -m pip_audit -r packaging/windows/requirements-win314-x64.lock --no-deps --disable-pip --progress-spinner off

  windows-v2-frozen-installed-smoke:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14.10"
          architecture: x64

      - name: Assert security-patched Windows Python runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "import platform, struct, sys; sys.exit(0 if sys.version_info[:3] == (3, 14, 10) and platform.system() == 'Windows' and struct.calcsize('P') == 8 else 'Unsupported Windows Python runtime: ' + sys.version)"
          if ($LASTEXITCODE -ne 0) { throw "Windows build requires security-patched Python 3.14.10 x64" }

      - name: Parse native acceptance builder without execution
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/build_v2_m73_local.ps1").Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | Out-String | Write-Error
            throw "M7.3 local Windows builder has invalid PowerShell syntax"
          }
      - name: Install SHA-256 locked Windows x64 build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Never inherit unrelated globally installed runner packages.
          $venv = Join-Path $env:RUNNER_TEMP "reportmaker-v2-locked-venv"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw "Unable to create isolated Windows build environment" }
          $scripts = Join-Path $venv "Scripts"
          $env:PATH = "$scripts;$env:PATH"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $scripts
          $lock = "packaging/windows/requirements-win314-x64.lock"
          python scripts/windows_supply_chain.py --lock $lock --verify-only
          if ($LASTEXITCODE -ne 0) { throw "Invalid reviewed Windows dependency lock" }
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: --report "$env:RUNNER_TEMP/v2-locked-wheels.json" -r $lock
          if ($LASTEXITCODE -ne 0) { throw "Hash-verified wheel installation failed" }
          # The local source is not a PyPI wheel. Its dependencies are already locked.
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
          if ($LASTEXITCODE -ne 0) { throw "Isolated source installation failed" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Locked Windows dependency consistency failed" }

      - name: Validate source V2 smoke and M7 package boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QPA_FONTDIR = Join-Path $env:WINDIR "Fonts"
          $env:QTWEBENGINE_CHROMIUM_FLAGS = "--disable-gpu"
          python -m compileall -q src/reportmaker/v2 packaging/windows/v2_launcher.py tests/test_v2_m7_packaging.py scripts/verify_v2_frozen_archive.py tests/test_v2_retirement_boundary.py
          if ($LASTEXITCODE -ne 0) { throw "V2 compilation failed" }
          python -m reportmaker.v2 --offline-self-test
          if ($LASTEXITCODE -ne 0) { throw "Native V2 source offline smoke failed" }
          python -m reportmaker.v2 --html --offline-self-test
          if ($LASTEXITCODE -ne 0) { throw "HTML V2 source offline smoke failed" }
          python -m unittest discover -s tests -p test_v2_web_commands.py -v
          if ($LASTEXITCODE -ne 0) { throw "HTML V2 canonical rich-text regressions failed" }
          python -m unittest discover -s tests -p test_v2_web.py -v
          if ($LASTEXITCODE -ne 0) { throw "HTML V2 actual Chromium integration regressions failed" }
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -p test_v2_m7_packaging.py -v
          if ($LASTEXITCODE -ne 0) { throw "M7 package contract failed" }
          python -m unittest discover -s tests -p test_v2_retirement_boundary.py -v
          if ($LASTEXITCODE -ne 0) { throw "V2-only import and packaging boundary failed" }
          python -m unittest discover -s tests -p test_v2_canvas_layout_stress.py -v
          if ($LASTEXITCODE -ne 0) { throw "V2 canvas overlap/draft-interference regressions failed" }
          python -m unittest discover -s tests -p test_v2_theme.py -v
          if ($LASTEXITCODE -ne 0) { throw "V2 rail/theme regression failed" }
          python -m unittest discover -s tests -p test_v2_workspace.py -v
          if ($LASTEXITCODE -ne 0) { throw "V2 split/workspace draft regression failed" }
          python -m unittest discover -s tests -p test_v2_m73_native_draft_recovery.py -v
          if ($LASTEXITCODE -ne 0) { throw "M7.3 Windows pending-edit recovery regression failed" }
          python -m unittest discover -s tests -p test_v2_m73_photo_contrast.py -v
          if ($LASTEXITCODE -ne 0) { throw "M7.3 V2 light/dark photo control contrast regression failed" }
          python -m unittest discover -s tests -p test_v2_m67_checkpoint.py -v
          if ($LASTEXITCODE -ne 0) { throw "M6.7 checkpoint regression failed" }

      - name: Verify clean source before freezing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code HEAD -- src/reportmaker packaging/windows packaging/windows/v2_launcher.py
          if ($LASTEXITCODE -ne 0) { throw "Tracked source changed after checkout" }
          $untracked = @(git ls-files --others --exclude-standard -- src/reportmaker packaging/windows)
          if ($LASTEXITCODE -ne 0 -or $untracked.Count -ne 0) {
            throw "Unreviewed source files are present in frozen package input"
          }

      - name: Freeze actual V2 executable, not V1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # PyInstaller documents these controls for stable Python bytecode
          # ordering and Windows PE build timestamps. Use source commit time,
          # never a per-run clock value.
          $epoch = (git show -s --format=%ct HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $epoch -notmatch '^[0-9]{10,}$') {
            throw "Unable to establish deterministic source commit epoch"
          }
          $env:PYTHONHASHSEED = "1"
          $env:SOURCE_DATE_EPOCH = $epoch
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name ReportMakerV2 `
            --hidden-import PySide6.QtWebEngineWidgets `
            --hidden-import PySide6.QtWebEngineCore `
            --hidden-import PySide6.QtWebChannel `
            --hidden-import PySide6.QtSvg `
            --exclude-module reportmaker.__main__ `
            --exclude-module reportmaker.ui `
            --exclude-module reportmaker.visual_editor `
            --exclude-module reportmaker.page_editor `
            --exclude-module reportmaker.rich_editor `
            --exclude-module reportmaker.template_dialog `
            --exclude-module reportmaker.customer_ui `
            --exclude-module reportmaker.customer_probe `
            --exclude-module reportmaker.editor_probe `
            --exclude-module reportmaker.export_probe `
            --exclude-module reportmaker.layout_probe `
            --collect-all pillow_heif `
            --collect-data reportmaker `
            packaging/windows/v2_launcher.py
          if ($LASTEXITCODE -ne 0) { throw "V2 PyInstaller failed" }
          if (!(Test-Path "dist/ReportMakerV2/ReportMakerV2.exe")) {
            throw "Frozen V2 executable missing"
          }
          if (!(Test-Path "dist/ReportMakerV2/_internal")) {
            throw "Frozen dependencies missing"
          }
          python scripts/verify_v2_frozen_archive.py "dist/ReportMakerV2/ReportMakerV2.exe"
          if ($LASTEXITCODE -ne 0) { throw "V2 frozen module inventory gate failed" }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QPA_FONTDIR = Join-Path $env:WINDIR "Fonts"
          $env:QTWEBENGINE_CHROMIUM_FLAGS = "--disable-gpu"
          $exe = (Resolve-Path "dist/ReportMakerV2/ReportMakerV2.exe").Path
          $p = Start-Process -FilePath $exe -ArgumentList "--offline-self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Frozen native V2 offline smoke failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath $exe -ArgumentList @("--html", "--offline-self-test") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Frozen HTML V2 offline smoke failed: $($p.ExitCode)" }

      - name: Locate Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup install failed" }
          }

      - name: Build local-only distinct per-user V2 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw "ISCC not found" }
          $source = (Resolve-Path .).Path
          $output = Join-Path $env:RUNNER_TEMP "m7-v2-setup"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          & $compiler "/DSourceRoot=$source" "/DOutputRoot=$output" "packaging/windows/ReportMaker-V2-M7.iss"
          if ($LASTEXITCODE -ne 0) { throw "V2 installer build failed" }
          if (!(Test-Path (Join-Path $output "ReportMaker-V2-M7-Preview-Setup.exe"))) {
            throw "V2 installer missing"
          }

      - name: Silent install, compare binary, smoke and uninstall (CI only)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP "m7-v2-setup/ReportMaker-V2-M7-Preview-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "M7V2Installed"
          $installArgs = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART",
                           "/DIR=`"$installDir`"")
          $installation = Start-Process -FilePath $setup -ArgumentList $installArgs -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "Silent V2 installation failed: $($installation.ExitCode)"
          }
          $installedExe = Join-Path $installDir "ReportMakerV2.exe"
          try {
            if (!(Test-Path $installedExe)) { throw "Installed V2 exe missing" }
            # Compare the ENTIRE frozen payload, not just the small EXE.
            # Missing/modified DLLs, Qt plugins, and bundled resources must
            # not be mistaken for an intact installed Windows application.
            $originalDir = (Resolve-Path "dist/ReportMakerV2").Path
            $payloadFiles = @(Get-ChildItem -LiteralPath $originalDir -Recurse -File)
            if ($payloadFiles.Count -lt 2) { throw "Frozen V2 payload is incomplete" }
            foreach ($payload in $payloadFiles) {
              $relativePath = $payload.FullName.Substring($originalDir.Length + 1)
              $installedPayload = Join-Path $installDir $relativePath
              if (!(Test-Path -LiteralPath $installedPayload -PathType Leaf)) {
                throw "Installed frozen payload file is missing: $relativePath"
              }
              $originalHash = (Get-FileHash -LiteralPath $payload.FullName -Algorithm SHA256).Hash
              $installedHash = (Get-FileHash -LiteralPath $installedPayload -Algorithm SHA256).Hash
              if ($originalHash -ne $installedHash) {
                throw "Installed frozen payload file does not match: $relativePath"
              }
            }
            $env:QT_QPA_PLATFORM = "offscreen"
            $env:QT_QPA_FONTDIR = Join-Path $env:WINDIR "Fonts"
            $env:QTWEBENGINE_CHROMIUM_FLAGS = "--disable-gpu"
            $smoke = Start-Process -FilePath $installedExe -ArgumentList "--offline-self-test" -Wait -PassThru
            if ($smoke.ExitCode -ne 0) {
              throw "Installed native V2 offline smoke failed: $($smoke.ExitCode)"
            }
            $smoke = Start-Process -FilePath $installedExe -ArgumentList @("--html", "--offline-self-test") -Wait -PassThru
            if ($smoke.ExitCode -ne 0) {
              throw "Installed HTML V2 offline smoke failed: $($smoke.ExitCode)"
            }
            Write-Host "Synthetic hosted-Windows installed V2 smoke passed (NOT physical UI acceptance)"
          }
          finally {
            $uninstaller = Join-Path $installDir "unins000.exe"
            if (!(Test-Path $uninstaller)) {
              throw "V2 installed preview has no uninstaller; cannot claim clean uninstall"
            }
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
              "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) {
              throw "V2 CI uninstall failed: $($uninstall.ExitCode)"
            }
            if ((Test-Path $installedExe) -or
                (Test-Path (Join-Path $installDir "_internal"))) {
              throw "V2 binaries remain after the silent uninstall"
            }
          }

      - name: Record source/config/wheel/Qt/Chromium/installer provenance and SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not identify checked-out source" }
          $directory = Join-Path $env:RUNNER_TEMP "v2-provenance"
          python scripts/windows_supply_chain.py `
            --lock packaging/windows/requirements-win314-x64.lock `
            --pip-report "$env:RUNNER_TEMP/v2-locked-wheels.json" `
            --installer "$env:RUNNER_TEMP/m7-v2-setup/ReportMaker-V2-M7-Preview-Setup.exe" `
            --frozen-dir "dist/ReportMakerV2" `
            --source-sha $sourceSha --config-sha "${{ github.sha }}" `
            --branch-head-sha "${{ github.event.pull_request.head.sha || github.sha }}" `
            --configuration-file ".github/workflows/v2-m7-packaging.yml" `
            --output $directory
          if ($LASTEXITCODE -ne 0) { throw "Windows dependency provenance failed verification" }
          $details = Get-Content (Join-Path $directory "windows-v2-provenance.json") -Raw | ConvertFrom-Json
          @(
            "### Non-release Windows V2 dependency provenance"
            ""
            "Checked-out source: $($details.source_commit); reviewed branch head: $($details.reviewed_branch_head_commit)"
            "Configuration: $($details.configuration_commit); workflow SHA-256: $($details.configuration_file.sha256)"
            "Windows runner: $($details.github_runner_image.name) $($details.github_runner_image.version)"
            "Python: $($details.python); Qt: $($details.qt_runtime.qt); Chromium: $($details.qt_runtime.chromium)"
            "Chromium patch: $($details.qt_runtime.chromium_security_patch)"
            "Lock SHA-256: $($details.lock_sha256)"
            "Preview installer SHA-256: $($details.installer.sha256)"
            "Windows installed/frozen smoke passed; physical UI acceptance and release approval remain pending."
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Attach metadata only (never attach PR installers)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ReportMaker-V2-SUPPLY-CHAIN-${{ github.sha }}
          path: ${{ runner.temp }}/v2-provenance/*.json
          if-no-files-found: error
          retention-days: 7

      # The user explicitly requested an installer for physical M7.3 testing.
      # PR/push validation never reaches these steps. Manual opt-in only.
      - name: Prepare M7.3 unsigned manual-test installer checksums
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_qa_installer == true }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP "m7-v2-setup/ReportMaker-V2-M7-Preview-Setup.exe"
          if (!(Test-Path -LiteralPath $setup -PathType Leaf)) { throw "Test installer was not built" }
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Join-Path $env:RUNNER_TEMP "m7-v2-setup/M73-QA-CHECKSUMS.txt"
          @(
            "ReportMaker V2 M7.3 PREVIEW — UNSIGNED TEST INSTALLER, NOT A RELEASE"
            "source_commit=${{ github.sha }}"
            "installer_name=ReportMaker-V2-M7-Preview-Setup.exe"
            "installer_sha256=$hash"
            "Windows x64; V2-only isolated installation; V1 is unchanged"
            "The hosted Windows install/uninstall smoke passed, but physical GUI acceptance is NOT complete."
            "Do not use real customer reports or credentials when testing."
          ) | Set-Content -LiteralPath $manifest -Encoding utf8
          Write-Host "M7.3 manual test installer SHA-256: $hash"

      - name: Attach 1-day M7.3 manual QA installer (opt-in only, NOT a release)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_qa_installer == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ReportMaker-V2-M73-TEST-ONLY-${{ github.sha }}
          path: |
            ${{ runner.temp }}/m7-v2-setup/ReportMaker-V2-M7-Preview-Setup.exe
            ${{ runner.temp }}/m7-v2-setup/M73-QA-CHECKSUMS.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # This is intentionally a SEPARATE job. Untrusted pull-request jobs retain
  # contents:read and cannot obtain OIDC tokens or write attestations.
  # A trusted main-only explicit opt-in attests JSON metadata, NOT the installer
  # and is never a release or Authenticode code-signing claim.
  attest-nonrelease-metadata:
    if: ${{ github.event_name == 'workflow_dispatch' && github.repository == 'kandyman991/ReportMaker' && github.ref == 'refs/heads/main' && inputs.attest_nonrelease_metadata == true }}
    needs: [locked-windows-dependency-audit, windows-v2-frozen-installed-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download metadata from this successful trusted workflow run only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ReportMaker-V2-SUPPLY-CHAIN-${{ github.sha }}
          path: ${{ runner.temp }}/attestable-v2-metadata

      - name: Reject unexpected files, missing fields or installer bytes
        shell: bash
        env:
          METADATA_DIR: ${{ runner.temp }}/attestable-v2-metadata
          REVIEWED_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PYVALIDATE'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ["METADATA_DIR"])
          names = sorted(p.name for p in root.iterdir())
          assert names == ["windows-v2-provenance.json", "windows-v2-sbom.cdx.json"], names
          p = json.loads((root / names[0]).read_text(encoding="utf-8"))
          b = json.loads((root / names[1]).read_text(encoding="utf-8"))
          assert p["source_commit"] == os.environ["REVIEWED_MAIN_SHA"]
          assert p["reviewed_branch_head_commit"] == os.environ["REVIEWED_MAIN_SHA"]
          assert p["python"] == "3.14.10"
          assert len(p["wheels"]) == len(b["components"]) == 22
          assert len(p["frozen_payload"]) >= 3000
          assert re.fullmatch(r"[0-9a-f]{64}", p["installer"]["sha256"])
          assert b["bomFormat"] == "CycloneDX"
          print("Trusted-main metadata assertions passed; no binary will be attested or uploaded.")
          PYVALIDATE

      - name: Create short-lived OIDC-backed GitHub attestation for JSON only
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/attestable-v2-metadata/*.json
