name: M0 architecture and model gates

on:
  push:
  pull_request:

concurrency:
  # Cancel obsolete validation for the same workflow/event/PR or pushed ref.
  # A unique run ID exempts manually requested validation from supersession.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q src
      - name: Install Windows GUI dependencies
        run: python -m pip install -e ".[desktop]"
      - name: Verify PySide6 and Qt WebEngine import on Windows
        run: python -c "from reportmaker.ui import MainWindow; print('Windows desktop import OK')"
      - name: Exercise Qt pane sizing, collapse and restore offline
        shell: pwsh
        run: |
          python -m reportmaker --layout-self-test
          if ($LASTEXITCODE -ne 0) { throw "Qt layout smoke test failed" }
      - name: Exercise M3 visual editor, project dialogs and preview offline
        run: python -m reportmaker --visual-editor-self-test
      - name: Exercise M4 DOCX/PDF export through Qt offline
        run: python -m reportmaker --export-self-test
      - name: Verify invariant and core unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -v
