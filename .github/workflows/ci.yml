name: M0 architecture and model gates

on:
  push:
  pull_request:

jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python modules
        run: python -m compileall -q src
      - name: Verify invariant and core unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -v
