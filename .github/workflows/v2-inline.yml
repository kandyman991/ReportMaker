name: V2 M1.3 inline branch editing

on:
  pull_request:
    branches: [main]
    paths:
      - "src/reportmaker/v2/**"
      - "src/reportmaker/model.py"
      - "src/reportmaker/engine.py"
      - "src/reportmaker/rich_text.py"
      - "tests/test_v2_inline.py"
      - "tests/test_v2_heading.py"
      - "tests/test_v2_formatting.py"
      - "tests/test_v2_tables.py"
      - "tests/test_v2_m34.py"
      - "tests/test_v2_m4.py"
      - "tests/test_v2_m5.py"
      - "tests/test_v2_natural_cards.py"
      - "tests/test_v2_session.py"
      - ".github/workflows/v2-inline.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-v2-inline:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install desktop application
        run: python -m pip install -e ".[desktop]"
      - name: Compile V2 source and regression suites
        run: python -m compileall -q src/reportmaker/v2 tests/test_v2_inline.py tests/test_v2_heading.py tests/test_v2_formatting.py tests/test_v2_tables.py tests/test_v2_m34.py tests/test_v2_m4.py tests/test_v2_m5.py tests/test_v2_natural_cards.py
      - name: Run pure and offline Qt branch editing regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_inline.py -v
          if ($LASTEXITCODE -ne 0) { throw "V2 M1.3 regressions failed" }
      - name: Verify M3.1 heading edits and mixed-position insertions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_heading.py -v
          if ($LASTEXITCODE -ne 0) { throw "M3.1 heading editing regressions failed" }
      - name: Verify M3.2 contextual rich formatting and Unicode selection
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_formatting.py -v
          if ($LASTEXITCODE -ne 0) { throw "M3.2 contextual formatting regressions failed" }
      - name: Verify M3.3 inline table cells, grid structure and guarded drafts
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_tables.py -v
          if ($LASTEXITCODE -ne 0) { throw "M3.3 inline table regressions failed" }
      - name: Verify M3.4 mixed insertion, media references and cross-editor draft guards
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_m34.py -v
          if ($LASTEXITCODE -ne 0) { throw "M3.4 contextual insertion/draft coordination failed" }
      - name: Verify M4 photo import, annotations, native clipboard and drop guards
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_m4.py -v
          if ($LASTEXITCODE -ne 0) { throw "M4 photo integration regressions failed" }
      - name: Verify M5 focus, search, zoom, bounded windows and deep navigation
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_m5.py -v
          if ($LASTEXITCODE -ne 0) { throw "M5 navigation and scalability regressions failed" }
      - name: Verify natural-height card geometry and invisible scrollbars
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_natural_cards.py -v
          if ($LASTEXITCODE -ne 0) { throw "Branch Editor natural card layout failed" }
      - name: Run M1.2 command compatibility regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -p test_v2_session.py -v
          if ($LASTEXITCODE -ne 0) { throw "V2 M1.2 compatibility failed" }
