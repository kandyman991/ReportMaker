name: V2 M6.5 staged metadata localization contract

on:
  push:
    branches: [feature/v2-m6-5-metadata-localization]
    paths:
      - "src/reportmaker/v2/metadata_locale.py"
      - "tests/test_v2_m65_catalog.py"
      - ".github/workflows/v2-m65-stacked.yml"
      - "docs/v2/ADR_M6_5_METADATA_LOCALIZATION.md"
  pull_request:
    branches: [feature/v2-m6-full-integration, main]
    paths:
      - "src/reportmaker/v2/metadata_locale.py"
      - "tests/test_v2_m65_catalog.py"
      - ".github/workflows/v2-m65-stacked.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-m65-pure:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install ReportMaker
        run: python -m pip install -e ".[desktop]"
      - name: Compile pure localization module and tests
        run: python -m compileall -q src/reportmaker/v2/metadata_locale.py tests/test_v2_m65_catalog.py
      - name: Verify M6.5 semantic catalog, source digests and v4 preservation
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_m65_catalog.py -v
          if ($LASTEXITCODE -ne 0) { throw "M6.5 pure localization contract regressions failed" }
