name: V2 M6.5 staged metadata localization contract

on:
  # No paths filters: docs-only heads, future v5 serializer/editor/export changes
  # and CI edits must all run the exact-head M6.5 gate.
  push:
    branches: [feature/v2-m6-5-metadata-localization]
  pull_request:
    branches: [feature/v2-m6-full-integration, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-m65-pure:
    # Avoid running the staged gate for unrelated PRs targeting main.
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'feature/v2-m6-5-metadata-localization'
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install ReportMaker
        run: python -m pip install -e ".[desktop]"
      - name: Compile pure localization module and tests
        run: python -m compileall -q src/reportmaker/v2/metadata_locale.py tests/test_v2_m65_catalog.py tests/test_v2_m65_integration.py tests/test_v2_m65_qt.py
      - name: Verify M6.5 semantic catalog, source digests and v4 preservation
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_m65_catalog.py -v
          if ($LASTEXITCODE -ne 0) { throw "M6.5 pure localization contract regressions failed" }
          python -m unittest discover -s tests -p test_v2_m65_integration.py -v
          if ($LASTEXITCODE -ne 0) { throw "M6.5 schema, command and export integration failed" }
          python -m unittest discover -s tests -p test_v2_m65_qt.py -v
          if ($LASTEXITCODE -ne 0) { throw "M6.5 Qt metadata and PDF proof gate failed" }
