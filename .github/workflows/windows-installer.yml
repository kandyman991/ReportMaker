name: Windows installer (M0 prototype)

on:
  push:
    branches:
      - feature/m0-windows-installer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install pinned app and packaging dependencies
        shell: pwsh
        run: |
          python -m pip install -e ".[desktop]"
          python -m pip install -r packaging/windows/requirements-build.txt
      - name: Freeze self-contained Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name ReportMaker --hidden-import=PySide6.QtWebEngineWidgets --hidden-import=PySide6.QtWebEngineCore packaging/windows/launcher.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }
          if (!(Test-Path "dist/ReportMaker/ReportMaker.exe")) { throw "Frozen exe not found" }
      - name: Test bundled Qt WebEngine offline
        shell: pwsh
        run: |
          $test = Start-Process -FilePath "$PWD\dist\ReportMaker\ReportMaker.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw "Frozen WebEngine about:blank self-test failed: $($test.ExitCode)" }
      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw "ISCC.exe not found" }
          New-Item -ItemType Directory -Force "dist-installer" | Out-Null
          & $compiler "packaging/windows/ReportMaker.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed" }
          if (!(Test-Path "dist-installer/ReportMaker-M0-Setup.exe")) { throw "Installer not found" }
      - name: Produce installer SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist-installer/ReportMaker-M0-Setup.exe").Hash.ToLowerInvariant()
          "$hash  ReportMaker-M0-Setup.exe" | Out-File -FilePath "dist-installer/SHA256SUMS.txt" -Encoding ascii
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ReportMaker-Windows-M0-Setup-${{ github.sha }}
          path: |
            dist-installer/ReportMaker-M0-Setup.exe
            dist-installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
