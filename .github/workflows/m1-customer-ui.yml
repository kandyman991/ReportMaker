name: M1 Windows customer UI smoke test

on:
  pull_request:
  # After M1 integration, keep validation on main without publishing artifacts.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-customer-ui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Install desktop application
        run: python -m pip install -e ".[desktop]"
      - name: Compile M1 sources
        run: python -m compileall -q src
      - name: Run isolated synthetic database and model tests
        run: python -m unittest discover -s tests -v
      - name: Exercise real Qt customer manager offline
        run: python -m reportmaker --customer-self-test
