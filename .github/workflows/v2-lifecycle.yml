name: V2 M1.4 project lifecycle and Checkpoint A

on:
  pull_request:
    branches: [main]
    paths:
      - "src/reportmaker/v2/**"
      - "src/reportmaker/model.py"
      - "src/reportmaker/project_io.py"
      - "tests/test_v2_lifecycle.py"
      - "tests/test_v2_inline.py"
      - "tests/test_v2_session.py"
      - ".github/workflows/v2-lifecycle.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-v2-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install native desktop dependencies
        run: python -m pip install -e ".[desktop]"
      - name: Compile application and test code
        run: python -m compileall -q src/reportmaker/v2 tests/test_v2_lifecycle.py tests/test_v2_inline.py tests/test_v2_session.py
      - name: Run M1.4 real Qt and pure lifecycle tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_lifecycle.py -v
          if ($LASTEXITCODE -ne 0) { throw "M1.4 Checkpoint A lifecycle regressions failed" }
      - name: Re-run M1.3 editor regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_inline.py -v
          if ($LASTEXITCODE -ne 0) { throw "M1.3 inline regressions failed" }
      - name: Re-run M1.2 canonical and persistence regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -p test_v2_session.py -v
          if ($LASTEXITCODE -ne 0) { throw "M1.2 compatibility failed" }
      - name: Verify V2 launch and V1 import firewall without browser
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m reportmaker.v2 --offline-self-test
          if ($LASTEXITCODE -ne 0) { throw "V2 offline shell failed" }
