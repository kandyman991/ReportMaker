name: V2 M1.1 Branch Editor shell

on:
  pull_request:
    branches: [main]
    paths:
      - "src/reportmaker/v2/**"
      - "src/reportmaker/model.py"
      - "src/reportmaker/engine.py"
      - "src/reportmaker/reference.py"
      - "src/reportmaker/rich_text.py"
      - "pyproject.toml"
      - "tests/test_v2_shell.py"
      - ".github/workflows/v2-branch-shell.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  windows-v2-shell:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install desktop application (no customer data)
        run: python -m pip install -e ".[desktop]"
      - name: Compile V2 package and tests
        run: python -m compileall -q src/reportmaker/v2 tests/test_v2_shell.py
      - name: Launch independent Branch Editor offline
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m reportmaker.v2 --offline-self-test
          if ($LASTEXITCODE -ne 0) { throw "V2 offline branch smoke failed" }
      - name: Validate V2 import firewall and connected branch projection
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m unittest discover -s tests -p test_v2_shell.py -v
          if ($LASTEXITCODE -ne 0) { throw "V2 shell regressions failed" }
