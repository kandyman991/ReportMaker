name: Linux application CI and dependency advisories

# Add Linux application testing without changing or replacing Windows gates.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  linux-application:
    name: Ubuntu 24.04 Python ${{ matrix.python-version }} application tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-31
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-10-31
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install Qt runtime libraries for headless GUI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 fonts-dejavu-core
      - name: Install desktop app and test coverage
        run: |
          python -m pip install --disable-pip-version-check -e ".[desktop]" coverage==7.11.3
          python -m pip check
      - name: Compile all application source
        run: python -m compileall -q src
      - name: Native V2 offline application smoke
        run: python -m reportmaker.v2 --offline-self-test
      - name: HTML Studio QtWebEngine and QWebChannel offline smoke
        run: python -m reportmaker.v2 --html --offline-self-test
      - name: Run complete source regression suite with coverage
        run: python -m coverage run --source=reportmaker -m unittest discover -s tests -v
      - name: Report coverage without an arbitrary new threshold
        run: python -m coverage report --precision=1

  quality-and-advisory:
    name: Critical lint and dependency advisory visibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-31
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-10-31
        with:
          python-version: '3.12'
      - name: Install static analysis and security audit tools
        run: python -m pip install --disable-pip-version-check ruff==0.14.3 pip-audit==2.10.1
      - name: Enforce high-confidence Python lint, including all legacy modules
        run: ruff check --select E9,F63,F7,F82 src tests scripts
      - name: Extend critical lint checks to V2 and new baseline tests
        run: ruff check --select E4,E9,F63,F7,F82 src/reportmaker/v2 tests/test_cleanup_phase1_golden.py tests/test_phase2_ci_contract.py
      - name: Install real application dependencies to audit their resolved versions
        run: |
          python -m pip install --disable-pip-version-check -e ".[desktop]"
          python -m pip check
      - name: Audit resolved dependencies (advisory only until locked #105 gate)
        id: audit
        continue-on-error: true
        run: python -m pip_audit --progress-spinner off
      - name: Surface non-blocking security findings explicitly
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" != "success" ]; then
            echo "::warning title=Dependency audit requires triage::pip-audit did not pass; this is an advisory-only Phase 2 gate until the Windows dependency lock and remediation in issue #105."
            echo "Dependency audit: NOT CLEAN (advisory only)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Dependency audit: passed for this runner's resolved dependencies; not a Windows release lock." >> "$GITHUB_STEP_SUMMARY"
          fi
